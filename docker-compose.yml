name: sayso

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sayso
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sayso']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: sayso-web
    build:
      context: .
      dockerfile: Dockerfile.web
    command: ['node', 'scripts/wait-and-migrate.mjs']
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/sayso
      DEMO_SEED: ${DEMO_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  web:
    image: sayso-web
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - '3000:3000'
    environment:
      # compose-internal hosts/ports override the .env dev defaults (5433/6380)
      DATABASE_URL: postgres://postgres:postgres@db:5432/sayso
      REDIS_URL: redis://redis:6379
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/sayso
      REDIS_URL: redis://redis:6379
      PORT: '3001'
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
