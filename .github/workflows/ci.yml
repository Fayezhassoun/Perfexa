name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # redis-memory-server compiles RedisTimeSeries and currently fails on
      # ubuntu-latest. Pilot CI does not exercise the worker package, so skip
      # all install scripts and rebuild only the binaries these checks need.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild embedded-postgres @embedded-postgres/linux-x64
      - run: pnpm typecheck
      - run: pnpm --filter @growthcrew/integrations test
      - run: pnpm --filter @growthcrew/agents test
