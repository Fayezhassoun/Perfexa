# ── fly.toml — GrowthCrew on Fly.io ──────────────────────────────
app = "growthcrew"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# Run schema migrations before routing traffic to the new release.
# Idempotent (CREATE TABLE IF NOT EXISTS). Prevents silent schema drift —
# this is what previously let the Business Memory table go missing in prod.
[deploy]
  release_command = "node /app/migrate.cjs"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  LLM_PROVIDER = "mock"
  LLM_MODEL = "deepseek-chat"
  STT_PROVIDER = "mock"
  TTS_PROVIDER = "mock"
  SEO_AUDIT_MODE = "mock"
  DEMO_SEED = "true"
  NEXT_PUBLIC_STT_PROVIDER = "mock"
  NEXT_PUBLIC_TTS_PROVIDER = "mock"
  NEXT_PUBLIC_APP_URL = "https://growthcrew.fly.dev"
  AUTH_URL = "https://growthcrew.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

# ── Weekly report cron ────────────────────────────────────────────
# The weekly report email trigger is an HTTP endpoint on this web service:
#
#   POST https://growthcrew.fly.dev/api/cron/weekly-report
#   Authorization: Bearer $CRON_SECRET
#
# Schedule it for Mondays 08:00 UTC (cron "0 8 * * 1"). Fly has no declarative
# HTTP-cron field, so hit the endpoint from an external scheduler, e.g.:
#
#   flyctl machine run --schedule "0 8 * * 1" \
#     "curl -fsS -X POST -H \"Authorization: Bearer $CRON_SECRET\" \
#      https://growthcrew.fly.dev/api/cron/weekly-report"
#
# Set the secret once with: flyctl secrets set CRON_SECRET=<random>.
# Without CRON_SECRET the endpoint returns 401 (cron disabled). The run is
# idempotent per ISO week, so an early/late trigger won't double-send.

# ── Live data sync cron ───────────────────────────────────────────
# Pulls live campaigns from every org's connected ad platforms into
# campaigns_mirror (the table reports/alerts/anomaly-detection read):
#
#   POST https://growthcrew.fly.dev/api/cron/sync
#   Authorization: Bearer $CRON_SECRET
#
# Schedule it every 6 hours (cron "0 */6 * * *"), reusing the same
# CRON_SECRET as the weekly report:
#
#   flyctl machine run --schedule "0 */6 * * *" \
#     "curl -fsS -X POST -H \"Authorization: Bearer $CRON_SECRET\" \
#      https://growthcrew.fly.dev/api/cron/sync"
#
# Without CRON_SECRET the endpoint returns 401 (cron disabled). The sync is
# an idempotent upsert, so an early/late trigger is harmless. Per-platform
# failures are isolated — one bad account won't abort the rest of the run.

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[services]]
  protocol = "tcp"
  internal_port = 3000

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.tcp_checks]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

# ── Volumes ────────────────────────────────────────────────────────
# SQLite for embedded persistence (no external Postgres needed for demo)
[mounts]
  source = "growthcrew_data"
  destination = "/data"